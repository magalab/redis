name: Publish image to GHCR

on:
  push:
    tags:
      - '*'
  workflow_dispatch:
    inputs:
      tag:
        description: Official Redis tag to build
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  REDIS_REF: ${{ inputs.tag || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.variant }} ${{ matrix.arch }} image
    strategy:
      fail-fast: false
      matrix:
        include:
          - variant: debian
            arch: amd64
            runner: ubuntu-latest
            dockerfile: docker/Dockerfile.runtime
            tag_suffix: ''
            pinned_suffix: '-trixie'
            latest_tag: latest
            pinned_tag: trixie
          - arch: arm64
            variant: debian
            runner: ubuntu-24.04-arm
            dockerfile: docker/Dockerfile.runtime
            tag_suffix: ''
            pinned_suffix: '-trixie'
            latest_tag: latest
            pinned_tag: trixie
          - variant: alpine
            arch: amd64
            runner: ubuntu-latest
            dockerfile: docker/Dockerfile.runtime-alpine
            tag_suffix: '-alpine'
            pinned_suffix: '-alpine3.23'
            latest_tag: alpine
            pinned_tag: alpine3.23
          - variant: alpine
            arch: arm64
            runner: ubuntu-24.04-arm
            dockerfile: docker/Dockerfile.runtime-alpine
            tag_suffix: '-alpine'
            pinned_suffix: '-alpine3.23'
            latest_tag: alpine
            pinned_tag: alpine3.23
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out workflow files
        uses: actions/checkout@v6
        with:
          ref: unstable

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}${{ matrix.tag_suffix }},value=${{ env.REDIS_REF }}
            type=semver,pattern={{major}}.{{minor}}${{ matrix.tag_suffix }},value=${{ env.REDIS_REF }}
            type=semver,pattern={{major}}${{ matrix.tag_suffix }},value=${{ env.REDIS_REF }}
            type=semver,pattern={{version}}${{ matrix.pinned_suffix }},value=${{ env.REDIS_REF }}
            type=semver,pattern={{major}}.{{minor}}${{ matrix.pinned_suffix }},value=${{ env.REDIS_REF }}
            type=semver,pattern={{major}}${{ matrix.pinned_suffix }},value=${{ env.REDIS_REF }}
            type=raw,value=${{ matrix.latest_tag }}
            type=raw,value=${{ matrix.pinned_tag }}
          flavor: |
            suffix=-${{ matrix.arch }}

      - name: Build and push architecture image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/${{ matrix.arch }}
          push: true
          build-args: |
            REDIS_REF=${{ env.REDIS_REF }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.variant }}-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.variant }}-${{ matrix.arch }}

  publish-manifest:
    name: Publish ${{ matrix.variant }} manifests
    needs: build
    strategy:
      matrix:
        include:
          - variant: debian
            tag_suffix: ''
            pinned_suffix: '-trixie'
            latest_tag: latest
            pinned_tag: trixie
          - variant: alpine
            tag_suffix: '-alpine'
            pinned_suffix: '-alpine3.23'
            latest_tag: alpine
            pinned_tag: alpine3.23
    runs-on: ubuntu-latest

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract final image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}${{ matrix.tag_suffix }},value=${{ env.REDIS_REF }}
            type=semver,pattern={{major}}.{{minor}}${{ matrix.tag_suffix }},value=${{ env.REDIS_REF }}
            type=semver,pattern={{major}}${{ matrix.tag_suffix }},value=${{ env.REDIS_REF }}
            type=semver,pattern={{version}}${{ matrix.pinned_suffix }},value=${{ env.REDIS_REF }}
            type=semver,pattern={{major}}.{{minor}}${{ matrix.pinned_suffix }},value=${{ env.REDIS_REF }}
            type=semver,pattern={{major}}${{ matrix.pinned_suffix }},value=${{ env.REDIS_REF }}
            type=raw,value=${{ matrix.latest_tag }}
            type=raw,value=${{ matrix.pinned_tag }}

      - name: Create multi-architecture manifests
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_BASE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          VERSION: ${{ env.REDIS_REF }}
          TAG_SUFFIX: ${{ matrix.tag_suffix }}
        run: |
          while IFS= read -r tag; do
            [ -z "$tag" ] && continue
            docker buildx imagetools create \
              --tag "$tag" \
              "${IMAGE_BASE}:${VERSION}${TAG_SUFFIX}-amd64" \
              "${IMAGE_BASE}:${VERSION}${TAG_SUFFIX}-arm64"
          done <<< "$IMAGE_TAGS"
