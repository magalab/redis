name: Sync latest Redis release

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: sync-redis-major
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/redis/redis.git

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Check out maintained branch
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Find latest Redis major and release tag
        id: upstream
        shell: bash
        run: |
          set -euo pipefail

          branch="$(
            git ls-remote --heads "$UPSTREAM_URL" |
              awk '{sub("refs/heads/", "", $2); print $2}' |
              grep -E '^[0-9]+\\.[0-9]+$' |
              sort -V |
              tail -n 1
          )"
          major="${branch%%.*}"

          tag="$({
            git ls-remote --tags --refs "$UPSTREAM_URL" "refs/tags/${major}.*" |
              awk -F/ '{print $3}'
          } | grep -E "^${major}\\.[0-9]+\\.[0-9]+$" | sort -V | tail -n 1)"

          test -n "$branch" || { echo 'No matching upstream major branch found' >&2; exit 1; }
          test -n "$tag" || { echo 'No matching upstream release tag found' >&2; exit 1; }

          echo "major=$major" >> "$GITHUB_OUTPUT"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "Using latest upstream major: $major"
          echo "Using upstream branch: $branch"
          echo "Using upstream release tag: $tag"

      - name: Merge official release into main
        id: merge
        shell: bash
        env:
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote add upstream "$UPSTREAM_URL"
          RELEASE_TAG="${{ steps.upstream.outputs.tag }}"
          git fetch --no-tags upstream \
            "+refs/tags/${RELEASE_TAG}:refs/remotes/upstream/tags/${RELEASE_TAG}"

          before=$(git rev-parse HEAD)
          if git merge-base --is-ancestor "refs/remotes/upstream/tags/${RELEASE_TAG}" HEAD; then
            echo "Release ${RELEASE_TAG} is already contained in main."
          elif ! git merge --no-ff --no-edit "refs/remotes/upstream/tags/${RELEASE_TAG}"; then
            git merge --abort || true
            echo 'Upstream merge has conflicts; remote branches were not changed.' >&2
            exit 1
          fi
          after=$(git rev-parse HEAD)

          if [ "$before" = "$after" ]; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            echo 'Already synchronized.'
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            echo "Merged upstream into $after"
          fi

      - name: Push updated main
        if: steps.merge.outputs.changed == 'true'
        run: |
          set -euo pipefail
          git push origin HEAD:main

      - name: Synchronize upstream-only unstable branch
        shell: bash
        run: |
          set -euo pipefail

          git fetch --no-tags origin unstable
          git fetch --no-tags upstream \
            '+refs/heads/unstable:refs/remotes/upstream/unstable'
          git switch --detach origin/unstable

          if git merge-base --is-ancestor HEAD refs/remotes/upstream/unstable; then
            # Once unstable is reset to upstream, keep it byte-for-byte aligned
            # with fast-forward updates and do not create downstream commits.
            git merge --ff-only refs/remotes/upstream/unstable
          else
            # One-time compatibility path for the existing diverged branch.
            if ! git merge --no-ff --no-edit refs/remotes/upstream/unstable; then
              git merge --abort || true
              echo 'Upstream unstable merge has conflicts; unstable was not changed.' >&2
              exit 1
            fi

            # Keep downstream maintenance files on main only.
            rm -f \
              .github/workflows/publish-ghcr.yml \
              .github/workflows/sync-redis-major.yml \
              docker/Dockerfile.runtime \
              docker/Dockerfile.runtime-alpine \
              docker/docker-entrypoint.sh

            git add -A
            if ! git diff --cached --quiet; then
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'Keep unstable aligned with upstream'
            fi
          fi

          git push origin HEAD:unstable

      - name: Create and push matching release tag
        id: tag
        env:
          RELEASE_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          set -euo pipefail

          remote_tag=$(git ls-remote origin "refs/tags/${RELEASE_TAG}" | awk '{print $1}')
          if [ -n "$remote_tag" ]; then
            echo "Release tag ${RELEASE_TAG} already exists on origin; leaving it unchanged."
            echo 'created=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git tag "$RELEASE_TAG" HEAD
          git push origin "refs/tags/${RELEASE_TAG}"
          echo 'created=true' >> "$GITHUB_OUTPUT"

      - name: Trigger GHCR build for release tag
        if: steps.tag.outputs.created == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ steps.upstream.outputs.tag }}
        run: |
          gh workflow run publish-ghcr.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f tag="$RELEASE_TAG"
